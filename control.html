<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer Remote — Advancement</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg: #f4f2ed;
        --surface: #ffffff;
        --surface-muted: #f8f6f2;
        --border: #e2ded5;
        --accent: #9a6b2f;
        --accent-hover: #835924;
        --accent-soft: #f5efe6;
        --text: #1c1917;
        --text-muted: #78716c;
        --danger: #c93b3b;
        --warn: #c97a16;
        --success: #25855a;
        --radius: 12px;
      }

      html, body {
        min-height: 100%;
        font-family: "DM Sans", system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      .page {
        max-width: 440px; margin: 0 auto;
        padding: 1.5rem 1.25rem 3.5rem;
        display: none;
      }
      .page.unlocked { display: block; }

      /* Top bar */
      .topbar {
        display: flex; align-items: center; justify-content: space-between;
        gap: 1rem; margin-bottom: 1.25rem;
      }
      .page-title {
        font-family: "Barlow", sans-serif; font-size: 1.25rem; font-weight: 600;
        color: var(--text); letter-spacing: -0.01em; line-height: 1.2;
      }
      .page-sub {
        font-size: 0.8rem; color: var(--text-muted); margin-top: 2px;
      }

      /* Lock button */
      .lock-badge {
        display: none;
        font-size: 0.8rem; font-weight: 500; color: var(--text-muted);
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 8px; padding: 6px 12px; cursor: pointer;
        font-family: inherit;
        transition: color 0.15s, border-color 0.15s, background 0.15s;
      }
      .lock-badge:hover {
        color: var(--danger); border-color: #eab8b8; background: #fdf6f6;
      }

      /* Status bar */
      .status-bar {
        display: flex; align-items: center; justify-content: space-between;
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 10px; padding: 10px 14px; margin-bottom: 1rem;
        font-size: 0.8rem; color: var(--text-muted);
      }
      .status-live { display: flex; align-items: center; gap: 8px; font-weight: 500; }
      .status-dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: #d6d3cd; transition: background 0.3s; flex-shrink: 0;
      }
      .status-dot.live { background: var(--success); }
      .status-dot.error { background: var(--danger); }

      /* Card */
      .card {
        background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 1.25rem;
        box-shadow: 0 1px 2px rgba(28, 25, 23, 0.04);
        margin-bottom: 1rem;
      }
      .card-label {
        font-size: 0.85rem; font-weight: 600; color: var(--text);
        margin-bottom: 0.9rem;
      }

      /* Duration input */
      .duration-wrap { position: relative; margin-bottom: 0.9rem; }
      .duration-input {
        width: 100%; padding: 14px 52px 14px 16px;
        font-size: 2.25rem; font-family: "Barlow", sans-serif; font-weight: 600;
        font-variant-numeric: tabular-nums;
        text-align: center; background: var(--surface-muted);
        border: 1px solid var(--border); border-radius: 10px;
        color: var(--text); outline: none;
        -moz-appearance: textfield; transition: border-color 0.15s, background 0.15s;
      }
      .duration-input::-webkit-outer-spin-button,
      .duration-input::-webkit-inner-spin-button { -webkit-appearance: none; }
      .duration-input:focus {
        border-color: var(--accent); background: #fff;
      }
      .duration-unit {
        position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
        font-size: 0.8rem; font-weight: 500; color: var(--text-muted);
        pointer-events: none;
      }

      /* Quick presets */
      .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 1rem; }
      .preset {
        padding: 9px 6px; font-size: 0.82rem; font-weight: 500; text-align: center;
        background: var(--surface-muted); border: 1px solid var(--border);
        border-radius: 8px; color: var(--text); cursor: pointer;
        transition: background 0.15s, border-color 0.15s, color 0.15s;
        font-family: inherit;
      }
      .preset:hover { background: var(--accent-soft); border-color: #d6c3a8; }
      .preset.selected {
        background: var(--accent-soft); border-color: var(--accent);
        color: var(--accent); font-weight: 600;
      }

      /* Primary button */
      .send-btn {
        width: 100%; padding: 13px 16px; font-size: 0.92rem;
        font-family: inherit; font-weight: 600;
        background: var(--accent); border: none; border-radius: 10px;
        color: #ffffff; cursor: pointer;
        transition: background 0.15s, transform 0.1s;
      }
      .send-btn:hover { background: var(--accent-hover); }
      .send-btn:active { transform: scale(0.99); }
      .send-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
      .send-btn.alert-style { background: var(--danger); color: #fff; }
      .send-btn.alert-style:hover { background: #b13030; }

      /* Reset button */
      .reset-btn {
        width: 100%; padding: 11px 14px; font-size: 0.85rem;
        font-family: inherit; font-weight: 500;
        background: transparent; border: 1px solid #e7c2c2;
        border-radius: 9px; color: var(--danger);
        cursor: pointer; transition: background 0.15s, border-color 0.15s;
      }
      .reset-btn:hover {
        background: #fdf4f4; border-color: var(--danger);
      }

      /* Notice / Alert card */
      .notice-type-row {
        display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 0.85rem;
      }
      .notice-type-btn {
        padding: 8px 10px; font-size: 0.82rem; font-family: inherit; font-weight: 500;
        background: var(--surface-muted); border: 1px solid var(--border);
        border-radius: 8px; color: var(--text-muted); cursor: pointer;
        transition: background 0.15s, border-color 0.15s, color 0.15s;
      }
      .notice-type-btn.active.notice {
        background: var(--accent-soft); border-color: var(--accent);
        color: var(--accent); font-weight: 600;
      }
      .notice-type-btn.active.alert {
        background: #fdf2f2; border-color: var(--danger);
        color: var(--danger); font-weight: 600;
      }

      .notice-textarea {
        width: 100%; min-height: 80px; resize: vertical;
        padding: 11px 13px; font-size: 0.92rem; font-family: inherit;
        background: var(--surface-muted); border: 1px solid var(--border);
        border-radius: 9px; color: var(--text); outline: none;
        margin-bottom: 0.7rem; line-height: 1.45;
        transition: border-color 0.15s, background 0.15s;
      }
      .notice-textarea:focus {
        border-color: var(--accent); background: #fff;
      }

      .notice-chips {
        display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 0.95rem;
      }
      .notice-chip {
        padding: 5px 10px; font-size: 0.76rem; font-family: inherit; font-weight: 500;
        background: var(--surface-muted); border: 1px solid var(--border);
        border-radius: 99px; color: var(--text); cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }
      .notice-chip:hover {
        background: var(--accent-soft); border-color: #d6c3a8;
      }

      .notice-duration-row {
        display: flex; align-items: center; justify-content: space-between;
        gap: 8px; margin-bottom: 1rem;
      }
      .notice-duration-label {
        font-size: 0.8rem; color: var(--text-muted); white-space: nowrap;
      }
      .notice-duration-pills { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
      .dur-pill {
        padding: 5px 9px; font-size: 0.76rem; font-family: inherit; font-weight: 500;
        background: var(--surface-muted); border: 1px solid var(--border);
        border-radius: 6px; color: var(--text-muted); cursor: pointer;
        transition: background 0.15s, border-color 0.15s, color 0.15s;
      }
      .dur-pill.selected {
        background: var(--accent-soft); border-color: var(--accent); color: var(--accent);
      }

      .active-notice-box {
        display: none; margin-top: 0.9rem; padding: 12px 14px;
        border-radius: 9px; background: var(--accent-soft);
        border: 1px solid #dfd0ba; text-align: left;
      }
      .active-notice-box.visible { display: block; }
      .active-notice-box.is-alert {
        background: #fdf2f2; border-color: #ebc2c2;
      }
      .active-notice-head {
        display: flex; align-items: center; justify-content: space-between;
        font-size: 0.75rem; font-weight: 600; color: var(--accent); margin-bottom: 0.35rem;
      }
      .active-notice-box.is-alert .active-notice-head { color: var(--danger); }
      .active-notice-text {
        font-size: 0.9rem; color: var(--text); line-height: 1.4;
        margin-bottom: 0.7rem; word-break: break-word;
      }
      .clear-notice-btn {
        width: 100%; padding: 8px 10px; font-size: 0.8rem;
        font-family: inherit; font-weight: 500;
        background: #fff; border: 1px solid #e7c2c2;
        border-radius: 7px; color: var(--danger); cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }
      .clear-notice-btn:hover {
        background: #fdf4f4; border-color: var(--danger);
      }

      /* Toast */
      .toast {
        position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(16px);
        background: #1c1917; border-radius: 9px; padding: 10px 16px;
        font-size: 0.82rem; font-weight: 500;
        box-shadow: 0 8px 24px rgba(28, 25, 23, 0.18);
        color: #fff; opacity: 0; transition: opacity 0.25s, transform 0.25s;
        pointer-events: none; white-space: nowrap; z-index: 100;
      }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      .toast.success { background: #1e6b48; }
      .toast.error   { background: #b52f2f; }

      /* Current state preview */
      .current-state {
        text-align: center; padding: 0.5rem;
        font-size: 0.8rem; color: var(--text-muted);
      }
      .current-state span { color: var(--text); font-weight: 600; }

      /* Live timer card */
      .live-card {
        display: none; background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 1.25rem;
        box-shadow: 0 1px 2px rgba(28, 25, 23, 0.04);
        margin-bottom: 1rem; text-align: center; transition: border-color 0.4s ease;
      }
      .live-card.visible { display: block; }
      .live-card-label {
        font-size: 0.78rem; font-weight: 600; color: var(--text-muted);
        margin-bottom: 0.65rem; text-align: left;
      }
      .live-time {
        font-family: "Barlow", sans-serif; font-size: 3rem; font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: var(--text); letter-spacing: -0.02em; line-height: 1.05;
        margin-bottom: 0.3rem; transition: color 0.4s;
      }
      .live-time.expired { color: var(--danger); font-size: 1.2rem; letter-spacing: 0.02em; }
      .live-overtime {
        display: none; font-size: 0.82rem; font-weight: 500; color: var(--danger);
        margin-bottom: 0.5rem;
      }
      .live-overtime.show { display: block; }
      .live-bar-bg {
        background: #ebe7df; border-radius: 99px;
        height: 6px; overflow: hidden; margin: 0.75rem 0 0.55rem;
      }
      .live-bar-fill {
        height: 100%; border-radius: 99px; background: var(--accent);
        transition: width 1s linear, background 0.6s ease; width: 100%;
      }
      .live-stats {
        display: flex; justify-content: space-between;
        font-size: 0.76rem; color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }

      /* PIN Gate */
      #pinGate {
        position: fixed; inset: 0; z-index: 200;
        display: flex; align-items: center; justify-content: center;
        padding: 1.5rem; background: var(--bg);
      }
      #pinGate.hidden { display: none; }

      .pin-card {
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 14px; padding: 2rem 1.75rem;
        width: 100%; max-width: 340px; text-align: center;
        box-shadow: 0 4px 16px rgba(28, 25, 23, 0.06);
      }
      .pin-title {
        font-family: "Barlow", sans-serif; font-size: 1.25rem; font-weight: 600;
        color: var(--text); margin-bottom: 0.25rem;
      }
      .pin-sub {
        font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem;
      }

      /* PIN dots */
      .pin-dots {
        display: flex; gap: 12px; justify-content: center; margin-bottom: 1.5rem;
      }
      .pin-dot {
        width: 12px; height: 12px; border-radius: 50%;
        border: 1.5px solid #cbc5b9;
        background: transparent; transition: background 0.15s, border-color 0.15s;
      }
      .pin-dot.filled { background: var(--accent); border-color: var(--accent); }
      .pin-dot.error  { background: var(--danger); border-color: var(--danger); }

      /* PIN keypad */
      .pin-keypad {
        display: grid; grid-template-columns: repeat(3, 1fr);
        gap: 8px; margin-bottom: 0.85rem;
      }
      .pin-key {
        padding: 14px 8px; font-size: 1.2rem; font-family: "Barlow", sans-serif;
        font-weight: 500; background: var(--surface-muted);
        border: 1px solid var(--border); border-radius: 9px;
        color: var(--text); cursor: pointer;
        transition: background 0.12s, transform 0.1s;
        user-select: none;
      }
      .pin-key:hover  { background: var(--accent-soft); }
      .pin-key:active { transform: scale(0.96); }
      .pin-key.del    { font-size: 1rem; color: var(--text-muted); }
      .pin-key.go {
        background: var(--accent); color: #fff; border: none;
        font-size: 0.88rem; font-family: inherit; font-weight: 600;
      }
      .pin-key.go:hover { background: var(--accent-hover); }

      .pin-error {
        font-size: 0.8rem; color: var(--danger);
        min-height: 1.2em; margin-top: 0.25rem;
        animation: pinshake 0.35s ease;
      }
      @keyframes pinshake {
        0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)}
        60%{transform:translateX(6px)}  80%{transform:translateX(-3px)}
      }
    </style>
  </head>
  <body>
    <!-- PIN Gate — covers everything until unlocked -->
    <div id="pinGate">
      <div class="pin-card">
        <div class="pin-title">Advancement Timer</div>
        <div class="pin-sub">Enter PIN to continue</div>

        <div class="pin-dots">
          <div class="pin-dot" id="dot0"></div>
          <div class="pin-dot" id="dot1"></div>
          <div class="pin-dot" id="dot2"></div>
          <div class="pin-dot" id="dot3"></div>
        </div>

        <div class="pin-keypad">
          <button class="pin-key" onclick="pinKey('1')">1</button>
          <button class="pin-key" onclick="pinKey('2')">2</button>
          <button class="pin-key" onclick="pinKey('3')">3</button>
          <button class="pin-key" onclick="pinKey('4')">4</button>
          <button class="pin-key" onclick="pinKey('5')">5</button>
          <button class="pin-key" onclick="pinKey('6')">6</button>
          <button class="pin-key" onclick="pinKey('7')">7</button>
          <button class="pin-key" onclick="pinKey('8')">8</button>
          <button class="pin-key" onclick="pinKey('9')">9</button>
          <button class="pin-key del" onclick="pinDel()">⌫</button>
          <button class="pin-key" onclick="pinKey('0')">0</button>
          <button class="pin-key go" onclick="pinSubmit()">Enter</button>
        </div>

        <div class="pin-error" id="pinError"></div>
      </div>
    </div>

    <div class="page">
      <div class="topbar">
        <div class="page-header">
          <div class="page-title">Advancement Timer</div>
          <div class="page-sub">Remote control</div>
        </div>
        <button type="button" class="lock-badge" id="lockBadge" onclick="pinLock()" title="Lock controls">Lock</button>
      </div>

      <!-- Connection status -->
      <div class="status-bar">
        <div class="status-live">
          <div class="status-dot" id="statusDot"></div>
          <span id="statusText">Connecting…</span>
        </div>
        <span id="serverState">—</span>
      </div>

      <!-- Live remaining time — shown when a timer is active -->
      <div class="live-card" id="liveCard">
        <div class="live-card-label">On screen now</div>
        <div class="live-time" id="liveTime">00:00:00</div>
        <div class="live-overtime" id="liveOvertime"></div>
        <div class="live-bar-bg">
          <div class="live-bar-fill" id="liveBar"></div>
        </div>
        <div class="live-stats">
          <span id="liveDuration">—</span>
          <span id="liveElapsed">Elapsed: —</span>
        </div>
      </div>

      <!-- Main control card -->
      <div class="card">
        <div class="card-label">Set duration</div>

        <div class="duration-wrap">
          <input type="number" class="duration-input" id="minutesInput" placeholder="45" min="1" max="600" />
          <div class="duration-unit">min</div>
        </div>

        <div class="presets">
          <button class="preset" onclick="setPreset(5, this)">5 min</button>
          <button class="preset" onclick="setPreset(10, this)">10 min</button>
          <button class="preset" onclick="setPreset(15, this)">15 min</button>
          <button class="preset" onclick="setPreset(30, this)">30 min</button>
          <button class="preset" onclick="setPreset(50, this)">50 min</button>
          <button class="preset" onclick="setPreset(60, this)">1 hour</button>
        </div>

        <button class="send-btn" id="sendBtn" onclick="sendStart()">Start timer</button>
      </div>

      <!-- Notice / Alert card -->
      <div class="card">
        <div class="card-label">Screen notice</div>

        <div class="notice-type-row">
          <button type="button" class="notice-type-btn active notice" id="typeNoticeBtn" onclick="setNoticeType('notice')">Notice</button>
          <button type="button" class="notice-type-btn alert" id="typeAlertBtn" onclick="setNoticeType('alert')">Alert</button>
        </div>

        <textarea class="notice-textarea" id="noticeInput" maxlength="240" placeholder="Type a message to display full-screen…"></textarea>

        <div class="notice-chips">
          <button type="button" class="notice-chip" onclick="setNoticePreset('Please wrap up soon')">Wrap up soon</button>
          <button type="button" class="notice-chip" onclick="setNoticePreset('5 minutes remaining')">5 min left</button>
          <button type="button" class="notice-chip" onclick="setNoticePreset('Next speaker is ready')">Next speaker ready</button>
          <button type="button" class="notice-chip" onclick="setNoticePreset('Time is up — please conclude')">Please conclude</button>
        </div>

        <div class="notice-duration-row">
          <span class="notice-duration-label">Display for</span>
          <div class="notice-duration-pills">
            <button type="button" class="dur-pill selected" onclick="setNoticeDuration(0, this)">Until cleared</button>
            <button type="button" class="dur-pill" onclick="setNoticeDuration(15, this)">15s</button>
            <button type="button" class="dur-pill" onclick="setNoticeDuration(30, this)">30s</button>
            <button type="button" class="dur-pill" onclick="setNoticeDuration(60, this)">60s</button>
          </div>
        </div>

        <button class="send-btn" id="sendNoticeBtn" onclick="sendNotice()">Send notice</button>

        <div class="active-notice-box" id="activeNoticeBox">
          <div class="active-notice-head">
            <span id="activeNoticeTypeLabel">Showing on screen</span>
            <span id="activeNoticeTimer"></span>
          </div>
          <div class="active-notice-text" id="activeNoticeText"></div>
          <button type="button" class="clear-notice-btn" onclick="clearNotice()">Clear notice</button>
        </div>
      </div>

      <!-- Reset card -->
      <div class="card">
        <div class="card-label">Screen controls</div>
        <button class="reset-btn" onclick="sendReset()">Reset timer on screen</button>
      </div>

      <div class="current-state" id="currentState">Waiting for server…</div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      const STATE_URL  = 'state.php';
      const POLL_MS    = 3000;
      const SESSION_KEY = 'timer_pin_ok';

      let pollInterval = null;
      let sessionPin   = '';   // PIN held in memory for the session

      // ════════════════════════════════════════════
      // PIN GATE
      // ════════════════════════════════════════════
      let pinBuffer = '';
      const MAX_PIN = 8;   // supports 4–8 digit PINs

      function pinKey(d) {
        if (pinBuffer.length >= MAX_PIN) return;
        pinBuffer += d;
        updateDots();
        if (pinBuffer.length >= 4) {
          // Auto-submit once 4+ digits entered and user taps Enter,
          // but also allow longer PINs — auto-submit at MAX_PIN
          if (pinBuffer.length === MAX_PIN) pinSubmit();
        }
      }

      function pinDel() {
        pinBuffer = pinBuffer.slice(0, -1);
        updateDots();
        clearPinError();
      }

      function updateDots() {
        for (let i = 0; i < 4; i++) {
          const dot = document.getElementById('dot' + i);
          dot.classList.toggle('filled', i < pinBuffer.length);
          dot.classList.remove('error');
        }
      }

      function clearPinError() {
        document.getElementById('pinError').textContent = '';
      }

      function showPinError(msg) {
        pinBuffer = '';
        updateDots();
        const el = document.getElementById('pinError');
        el.textContent = msg;
        // Flash dots red
        for (let i = 0; i < 4; i++) {
          const dot = document.getElementById('dot' + i);
          dot.classList.add('error');
          setTimeout(() => dot.classList.remove('error'), 600);
        }
      }

      async function pinSubmit() {
        if (pinBuffer.length < 4) {
          showPinError('PIN must be at least 4 digits');
          return;
        }

        const attempt = pinBuffer;
        pinBuffer = '';
        updateDots();

        try {
          const res  = await fetch(STATE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ command: 'verify-pin', pin: attempt })
          });
          const data = await res.json();

          if (data.ok) {
            sessionPin = attempt;
            sessionStorage.setItem(SESSION_KEY, '1');
            unlockUI();
          } else {
            showPinError('Incorrect PIN — try again');
          }
        } catch (e) {
          showPinError('Cannot reach server');
        }
      }

      function unlockUI() {
        document.querySelector('.page').classList.add('unlocked');
        document.getElementById('pinGate').classList.add('hidden');
        document.getElementById('lockBadge').style.display = 'block';
        // Start polling now that we're in
        pollState();
        pollInterval = setInterval(pollState, POLL_MS);
      }

      function pinLock() {
        sessionPin = '';
        sessionStorage.removeItem(SESSION_KEY);
        if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
        if (liveInterval) { clearInterval(liveInterval); liveInterval = null; }
        if (noticeTimer)  { clearInterval(noticeTimer);  noticeTimer  = null; }
        pinBuffer = '';
        updateDots();
        clearPinError();
        document.getElementById('lockBadge').style.display = 'none';
        document.getElementById('pinGate').classList.remove('hidden');
        document.querySelector('.page').classList.remove('unlocked');
      }

      // Allow keyboard input on PIN screen
      document.addEventListener('keydown', e => {
        if (!document.getElementById('pinGate').classList.contains('hidden')) {
          if (e.key >= '0' && e.key <= '9') pinKey(e.key);
          else if (e.key === 'Backspace') pinDel();
          else if (e.key === 'Enter') pinSubmit();
        }
      });

      // On page load — if session was already authenticated, skip PIN
      // (sessionStorage clears on tab close, so this only persists within same tab session)
      if (sessionStorage.getItem(SESSION_KEY) === '1') {
        // We don't have the PIN anymore after a hard refresh — must re-enter
        // sessionStorage flag only skips gate if PIN is still in memory (same session)
        // Since JS restarts on refresh, we always ask again for security
        sessionStorage.removeItem(SESSION_KEY);
      }

      // ════════════════════════════════════════════
      // TOAST
      // ════════════════════════════════════════════
      function showToast(msg, type = '') {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast show ' + type;
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.className = 'toast', 2800);
      }

      // ════════════════════════════════════════════
      // PRESETS
      // ════════════════════════════════════════════
      function setPreset(m, el) {
        document.getElementById('minutesInput').value = m;
        document.querySelectorAll('.preset').forEach(b => b.classList.remove('selected'));
        if (el) el.classList.add('selected');
      }

      document.getElementById('minutesInput').addEventListener('input', () => {
        document.querySelectorAll('.preset').forEach(b => b.classList.remove('selected'));
      });

      // ════════════════════════════════════════════
      // TIMER COMMANDS
      // ════════════════════════════════════════════
      let clockOffsetMs = 0;
      function getNowMs() { return Date.now() + clockOffsetMs; }

      async function sendStart() {
        const val = parseInt(document.getElementById('minutesInput').value);
        if (!val || val < 1 || val > 600) {
          showToast('Enter a valid duration (1–600 min)', 'error');
          return;
        }

        const btn = document.getElementById('sendBtn');
        btn.disabled = true;
        btn.textContent = 'Sending…';

        try {
          const res  = await fetch(STATE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ command: 'start', minutes: val, pin: sessionPin })
          });
          const data = await res.json();

          if (res.status === 401) { pinLock(); return; }

          if (data.ok) {
            if (data.state && data.state.serverTime) {
              clockOffsetMs = data.state.serverTime * 1000 - Date.now();
            }
            showToast(`${val} min timer started`, 'success');
            applyLiveState(data.state);
            applyNoticeState(data.state ? data.state.notice : null);
          } else {
            showToast('Error: ' + (data.error || 'Unknown'), 'error');
          }
        } catch (e) {
          showToast('Could not reach server', 'error');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Start timer';
        }
      }

      async function sendReset() {
        try {
          const res  = await fetch(STATE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ command: 'reset', minutes: 0, pin: sessionPin })
          });
          const data = await res.json();

          if (res.status === 401) { pinLock(); return; }

          if (data.ok) {
            showToast('Screen reset', 'success');
            hideLiveCard();
            applyNoticeState(null);
          } else {
            showToast('Error: ' + (data.error || 'Unknown'), 'error');
          }
        } catch (e) {
          showToast('Could not reach server', 'error');
        }
      }

      // ════════════════════════════════════════════
      // NOTICE / ALERT CONTROLS
      // ════════════════════════════════════════════
      let noticeType     = 'notice';
      let noticeDuration = 0;
      let activeNotice   = null;
      let noticeTimer    = null;

      function setNoticeType(type) {
        noticeType = type === 'alert' ? 'alert' : 'notice';
        document.getElementById('typeNoticeBtn').classList.toggle('active', noticeType === 'notice');
        document.getElementById('typeAlertBtn').classList.toggle('active', noticeType === 'alert');
        const btn = document.getElementById('sendNoticeBtn');
        btn.classList.toggle('alert-style', noticeType === 'alert');
        btn.textContent = noticeType === 'alert' ? 'Send alert' : 'Send notice';
      }

      function setNoticePreset(msg) {
        const input = document.getElementById('noticeInput');
        input.value = msg;
        input.focus();
      }

      function setNoticeDuration(sec, el) {
        noticeDuration = sec;
        document.querySelectorAll('.dur-pill').forEach(b => b.classList.remove('selected'));
        if (el) el.classList.add('selected');
      }

      async function sendNotice() {
        const input   = document.getElementById('noticeInput');
        const message = input.value.trim();
        if (!message) {
          showToast('Enter a notice or alert message', 'error');
          input.focus();
          return;
        }

        const btn = document.getElementById('sendNoticeBtn');
        btn.disabled = true;
        btn.textContent = 'Sending…';

        try {
          const res = await fetch(STATE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              command: 'send-notice',
              message,
              type: noticeType,
              duration: noticeDuration,
              pin: sessionPin
            })
          });
          const data = await res.json();

          if (res.status === 401) { pinLock(); return; }

          if (data.ok) {
            if (data.state && data.state.serverTime) {
              clockOffsetMs = data.state.serverTime * 1000 - Date.now();
            }
            showToast(noticeType === 'alert' ? 'Alert sent to screen' : 'Notice sent to screen', 'success');
            applyNoticeState(data.state ? data.state.notice : null);
          } else {
            showToast('Error: ' + (data.error || 'Unknown'), 'error');
          }
        } catch (e) {
          showToast('Could not reach server', 'error');
        } finally {
          btn.disabled = false;
          setNoticeType(noticeType);
        }
      }

      async function clearNotice() {
        try {
          const res = await fetch(STATE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ command: 'clear-notice', pin: sessionPin })
          });
          const data = await res.json();

          if (res.status === 401) { pinLock(); return; }

          if (data.ok) {
            showToast('Notice cleared', 'success');
            applyNoticeState(null);
          } else {
            showToast('Error: ' + (data.error || 'Unknown'), 'error');
          }
        } catch (e) {
          showToast('Could not reach server', 'error');
        }
      }

      function applyNoticeState(notice) {
        if (noticeTimer) { clearInterval(noticeTimer); noticeTimer = null; }
        const box = document.getElementById('activeNoticeBox');

        if (!notice || !notice.active || !notice.message) {
          activeNotice = null;
          box.classList.remove('visible', 'is-alert');
          return;
        }

        const expiresAtMs = (notice.duration > 0 && notice.sentAt)
          ? (notice.sentAt + notice.duration) * 1000
          : 0;
        if (expiresAtMs && getNowMs() >= expiresAtMs) {
          activeNotice = null;
          box.classList.remove('visible', 'is-alert');
          return;
        }

        activeNotice = notice;
        const isAlert = notice.type === 'alert';
        box.classList.add('visible');
        box.classList.toggle('is-alert', isAlert);
        document.getElementById('activeNoticeTypeLabel').textContent = isAlert ? 'Alert on screen' : 'Notice on screen';
        document.getElementById('activeNoticeText').textContent = notice.message;

        updateNoticePreviewTimer();
        if (expiresAtMs) {
          noticeTimer = setInterval(updateNoticePreviewTimer, 500);
        }
      }

      function updateNoticePreviewTimer() {
        const label = document.getElementById('activeNoticeTimer');
        if (!activeNotice || !activeNotice.duration || !activeNotice.sentAt) {
          label.textContent = 'Pinned';
          return;
        }
        const leftMs = (activeNotice.sentAt + activeNotice.duration) * 1000 - getNowMs();
        if (leftMs <= 0) {
          applyNoticeState(null);
          return;
        }
        label.textContent = `${Math.ceil(leftMs / 1000)}s left`;
      }

      // ════════════════════════════════════════════
      // LIVE TIMER CARD
      // ════════════════════════════════════════════
      let liveInterval = null;
      let liveSetAt    = 0;
      let liveMinutes  = 0;

      function pad(n) { return String(n).padStart(2, '0'); }

      function formatMs(ms) {
        const h = Math.floor(ms / 3600000);
        const m = Math.floor((ms % 3600000) / 60000);
        const s = Math.floor((ms % 60000) / 1000);
        return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
      }

      function hideLiveCard() {
        if (liveInterval) { clearInterval(liveInterval); liveInterval = null; }
        liveSetAt = 0; liveMinutes = 0;
        document.getElementById('liveCard').classList.remove('visible');
      }

      function applyLiveState(state) {
        if (!state) return;
        const cmd   = state.command || 'idle';
        const min   = state.minutes || 0;
        const setAt = state.setAt   || 0;

        if (cmd !== 'start' || min <= 0 || setAt <= 0) { hideLiveCard(); return; }

        if (setAt !== liveSetAt || min !== liveMinutes) {
          liveSetAt   = setAt;
          liveMinutes = min;
          if (liveInterval) clearInterval(liveInterval);
          liveTick();
          liveInterval = setInterval(liveTick, 500);
        }

        document.getElementById('liveCard').classList.add('visible');
      }

      function liveTick() {
        if (!liveSetAt || !liveMinutes) return;

        const totalMs  = liveMinutes * 60 * 1000;
        const endMs    = liveSetAt * 1000 + totalMs;
        const now      = getNowMs();
        const timeLeft = endMs - now;
        const elapsed  = now - liveSetAt * 1000;

        const timeEl   = document.getElementById('liveTime');
        const overtime = document.getElementById('liveOvertime');
        const bar      = document.getElementById('liveBar');
        const card     = document.getElementById('liveCard');

        document.getElementById('liveDuration').textContent = `Duration: ${liveMinutes} min`;
        document.getElementById('liveElapsed').textContent  = `Elapsed: ${formatMs(Math.max(0, elapsed))}`;

        if (timeLeft <= 0) {
          timeEl.className   = 'live-time expired';
          timeEl.textContent = 'Time expired';
          bar.style.width    = '0%';
          bar.style.background   = 'var(--danger)';
          card.style.borderColor = '#e6b8b8';
          const past = Math.abs(timeLeft);
          const pm   = Math.floor(past / 60000);
          const ps   = Math.floor((past % 60000) / 1000);
          overtime.className   = 'live-overtime show';
          overtime.textContent = pm > 0 ? `${pm}m ${pad(ps)}s over` : `${pad(ps)}s over`;
          return;
        }

        const h = Math.floor(timeLeft / 3600000);
        const m = Math.floor((timeLeft % 3600000) / 60000);
        const s = Math.floor((timeLeft % 60000) / 1000);
        timeEl.className   = 'live-time';
        timeEl.textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
        overtime.className = 'live-overtime';

        const pct = (timeLeft / totalMs) * 100;
        bar.style.width = pct + '%';

        if (pct <= 10) {
          bar.style.background   = 'var(--danger)';
          card.style.borderColor = '#e6b8b8';
        } else if (pct <= 25) {
          bar.style.background   = 'var(--warn)';
          card.style.borderColor = '#ebd0a4';
        } else if (pct <= 50) {
          bar.style.background   = '#c9932c';
          card.style.borderColor = '#e6d8bd';
        } else {
          bar.style.background   = 'var(--accent)';
          card.style.borderColor = 'var(--border)';
        }
      }

      // ════════════════════════════════════════════
      // POLL SERVER
      // ════════════════════════════════════════════
      async function pollState() {
        try {
          const res  = await fetch(STATE_URL + '?t=' + Date.now());
          const data = await res.json();

          if (data.serverTime) {
            clockOffsetMs = data.serverTime * 1000 - Date.now();
          }

          document.getElementById('statusDot').className    = 'status-dot live';
          document.getElementById('statusText').textContent = 'Connected';

          const cmd = data.command || 'idle';
          const min = data.minutes || 0;

          document.getElementById('serverState').textContent =
            cmd === 'start' ? `${min} min active`
            : cmd === 'reset' ? 'Reset' : 'Idle';

          document.getElementById('currentState').innerHTML =
            cmd === 'start'
              ? `Screen is running a <span>${min}-minute</span> timer`
              : cmd === 'reset'
              ? `Screen has been <span>reset</span>`
              : `Screen is <span>idle</span>`;

          applyLiveState(data);
          applyNoticeState(data.notice || null);

        } catch (e) {
          document.getElementById('statusDot').className    = 'status-dot error';
          document.getElementById('statusText').textContent = 'Cannot reach server';
          document.getElementById('serverState').textContent = '—';
        }
      }

      document.getElementById('minutesInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') sendStart();
      });

      document.getElementById('noticeInput').addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendNotice();
        }
      });
    </script>
  </body>
</html>
